# /etc/nginx/sites-available/galvarsport.cl
#
# Reemplazar server_name si se usa otro dominio.
# Este archivo asume que la app Node escucha en 127.0.0.1:3001.

server {
    listen 80;
    listen [::]:80;
    server_name galvarsport.cl www.galvarsport.cl;

    # Certbot usa este bloque durante la emision/renovacion inicial.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name galvarsport.cl www.galvarsport.cl;

    # Certbot llenara estas rutas al emitir el certificado.
    ssl_certificate /etc/letsencrypt/live/galvarsport.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/galvarsport.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15M;

    # www -> apex para evitar dos origins logicos en cookies y CORS.
    if ($host = www.galvarsport.cl) {
        return 301 https://galvarsport.cl$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
